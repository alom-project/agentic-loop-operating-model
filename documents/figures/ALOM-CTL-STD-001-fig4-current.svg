<text x="1782" y="1020" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Canonical records</text>
<rect id="trace" x="1760" y="1330" width="540" height="170" rx="13" fill="#f4f6f9" stroke="#8794a8" stroke-width="2.5"/>
<text x="1782" y="1377" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Trace and Evidence</text>
<text x="1782" y="1418" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Correlated events / artifacts</text>
<text x="1782" y="1450" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Trace ID / evidence refs</text>
<rect id="l5" x="720" y="1680" width="650" height="190" rx="13" fill="#fff7e9" stroke="#c08d33" stroke-width="2.5"/>
<text x="742" y="1727" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">L5 Shared Execution Plane</text>
<text x="742" y="1768" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Harness / Runner / Worker</text>
<text x="742" y="1800" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Tool / credential / sandbox enforcement</text>
<text x="742" y="1832" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Also supports direct interactive use</text>
<rect x="60" y="1930" width="2280" height="150" rx="12" fill="#f5f7fb" stroke="#c4d0e0" stroke-width="1.5"/>
<text x="83" y="1966" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Graph-related interactions apply when a Graph is used; a single Loop need not synthesize one.</text>
<text x="83" y="2002" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• L2 coordinates and records; L5 enforces runtime controls, and L7 retains canonical authority.</text>
<text x="83" y="2038" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• The L1 and cross-cutting requirements apply by policy; not every event or interface is drawn.</text>
</svg>
