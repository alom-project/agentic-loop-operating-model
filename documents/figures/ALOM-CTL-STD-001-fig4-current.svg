<text x="782" y="248" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Purpose / policy / identity / Human decision</text>
<rect id="l3" x="100" y="600" width="430" height="180" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="122" y="647" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">L3 Graph Engineering</text>
<text x="122" y="688" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Topology / routing / join</text>
<text x="122" y="720" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Used when Graph is required</text>
<rect id="l4" x="100" y="950" width="430" height="190" rx="13" fill="#f3effd" stroke="#8b70bd" stroke-width="2.5"/>
<text x="122" y="997" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">L4 Agentic Loop</text>
<text x="122" y="1038" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Plan / evaluate / verify / repair</text>
<text x="122" y="1070" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Loop terminal semantics</text>
<rect id="l2" x="760" y="680" width="550" height="460" rx="13" fill="#edf7f1" stroke="#55a276" stroke-width="2.5"/>
<text x="782" y="727" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">L2 Control Plane</text>
<text x="782" y="768" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Task admission / manifests</text>
<text x="782" y="800" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Durable state / scheduler / queue</text>
<text x="782" y="832" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Lease / dispatch / recovery</text>
<text x="782" y="864" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Correlate Graph / Loop / results</text>
<text x="782" y="896" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Trace / evidence / terminal gates</text>
