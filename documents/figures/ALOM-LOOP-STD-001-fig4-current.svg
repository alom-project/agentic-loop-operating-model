<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1850" viewBox="0 0 2400 1850" role="img" aria-labelledby="title desc">
<title id="title">Figure 4 · L4 and L5 execution boundary</title>
<desc id="desc">Each numbered arrow identifies a one-way contract; the layout is a representative interaction, not a state machine</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#435877"/></marker><marker id="deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b94848"/></marker></defs>
<rect width="2400" height="1850" fill="#fff"/>
<text x="55" y="65" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="bold" fill="#233654">Figure 4 · L4 and L5 execution boundary</text>
<text x="55" y="108" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#4a5e7c">Each numbered arrow identifies a one-way contract; the layout is a representative interaction, not a state machine</text>
<rect x="50" y="460" width="2300" height="380" rx="16" fill="#f6f8fb" stroke="#c2cde0" stroke-width="2"/>
<text x="75" y="499" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">L4 Agentic Loop</text>
<text x="75" y="532" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#425678">Responsibility groups within ALE</text>
<path id="edge-task" d="M550 320 L550 560" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="565" y="410" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">① Task / state</text>
<path id="edge-context" d="M900 320 L900 560" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="915" y="410" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">② ContextPack</text>
<path id="edge-oracle" d="M1500 320 L1500 560" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1515" y="410" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">⑨ Oracle evidence</text>
<path id="edge-policy" d="M2050 320 L2050 560" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="2065" y="400" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">⑪ Policy</text>
