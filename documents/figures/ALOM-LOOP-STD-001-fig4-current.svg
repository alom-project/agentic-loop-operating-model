<text x="2215" y="440" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">⑫ Escalate</text>
<path id="edge-plan" d="M570 645 L650 645" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="575" y="630" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">③ Plan</text>
