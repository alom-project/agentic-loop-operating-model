<text x="1145" y="630" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">⑧ Data</text>
<path id="edge-eval" d="M1710 645 L1790 645" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1715" y="630" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">⑩ Eval</text>
<path id="edge-intent" d="M800 730 L800 1190" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="820" y="970" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">④ ExecutionIntent</text>
<path id="edge-result" d="M1070 1190 L1070 730" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1090" y="1010" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">⑦ ExecutionResult</text>
<path id="edge-action" d="M1450 1240 L1750 1240" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1510" y="1225" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">⑤ Action</text>
