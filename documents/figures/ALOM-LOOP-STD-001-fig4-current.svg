<text x="1490" y="1305" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">⑥ Result / status</text>
<rect id="l2" x="80" y="170" width="490" height="150" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="102" y="217" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">L2 Control Plane</text>
<text x="102" y="258" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Task contract / durable state</text>
<rect id="l6" x="650" y="170" width="490" height="150" rx="13" fill="#edf7f1" stroke="#55a276" stroke-width="2.5"/>
<text x="672" y="217" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">L6 Context and Knowledge</text>
<text x="672" y="258" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">ContextPack / provenance</text>
<rect id="oracle" x="1220" y="170" width="490" height="150" rx="13" fill="#fff7e9" stroke="#c08d33" stroke-width="2.5"/>
<text x="1242" y="217" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">External Oracle</text>
<text x="1242" y="258" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">CI / tests / business evidence</text>
<rect id="l1" x="1790" y="170" width="490" height="150" rx="13" fill="#f3effd" stroke="#8b70bd" stroke-width="2.5"/>
<text x="1812" y="217" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">L1 Operating Model</text>
<text x="1812" y="258" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Policy / Human / stop authority</text>
<rect id="plan" x="80" y="560" width="490" height="170" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="102" y="607" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Bind and Plan</text>
<text x="102" y="648" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Task binding / PlanArtifact</text>
<rect id="coord" x="650" y="560" width="490" height="170" rx="13" fill="#edf7f1" stroke="#55a276" stroke-width="2.5"/>
<text x="672" y="607" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Execution Coordination</text>
<text x="672" y="648" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">ExecutionIntent / result</text>
<rect id="verify" x="1220" y="560" width="490" height="170" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="1242" y="607" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Evaluate and Verify</text>
<text x="1242" y="648" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Evaluate / check outcome facts</text>
<rect id="repair" x="1790" y="560" width="490" height="170" rx="13" fill="#f3effd" stroke="#8b70bd" stroke-width="2.5"/>
<text x="1812" y="607" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Repair and Terminate</text>
<text x="1812" y="648" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Repair / stop / escalate</text>
<rect id="l5" x="650" y="1190" width="800" height="180" rx="13" fill="#fff7e9" stroke="#c08d33" stroke-width="2.5"/>
<text x="672" y="1237" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">L5 Shared Execution Plane</text>
<text x="672" y="1278" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Effective Harness / Runner / tool</text>
<text x="672" y="1310" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Capability / sandbox enforcement</text>
<rect id="target" x="1750" y="1190" width="570" height="180" rx="13" fill="#f4f6f9" stroke="#8794a8" stroke-width="2.5"/>
<text x="1772" y="1237" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Operational SSOT / target</text>
<text x="1772" y="1278" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">System API / action / result</text>
<rect x="60" y="1580" width="2280" height="222" rx="12" fill="#f5f7fb" stroke="#c4d0e0" stroke-width="1.5"/>
<text x="83" y="1616" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• ALE comprises L2–L4; L5 is a shared execution boundary outside ALE and also supports direct interactive use.</text>
<text x="83" y="1652" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• L5 enforces capabilities, tool and credential controls, sandbox, network/egress, budgets and stopping.</text>
<text x="83" y="1688" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• L6 ContextPack access is authorized separately; context or a plan does not grant execution authority.</text>
<text x="83" y="1724" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Approval and escalation require the distinct Human authority when the applicable policy requires it.</text>
<text x="83" y="1760" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Canonical Trace / Evidence event output is omitted for readability and specified in Chapter 14.</text>
</svg>
