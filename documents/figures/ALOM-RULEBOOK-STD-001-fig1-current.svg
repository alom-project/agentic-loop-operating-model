<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1060" viewBox="0 0 1900 1060" role="img" aria-labelledby="title desc">
<title id="title">Rulebook onboarding and consumption</title><desc id="desc">Structured review diagram with aligned panels and orthogonal connections.</desc>
<rect width="1900" height="1060" fill="#ffffff"/>
<defs>
<marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7558c5"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398e66"/></marker>
</defs>
<g id="panel-onboarding"><rect x="20" y="90" width="1860" height="470" rx="12" fill="#ffffff" stroke="#8e9aae" stroke-width="2"/>
<text x="33" y="112" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#8e9aae">Controlled Knowledge materialization</text>
</g>
<g id="panel-consumer"><rect x="20" y="590" width="1860" height="335" rx="12" fill="#ffffff" stroke="#8e9aae" stroke-width="2"/>
<text x="33" y="612" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#8e9aae">Consumption using released Rules</text>
</g>
<g id="edge-source-inventory" data-source="source" data-target="inventory" data-label="register"><polyline points="345,238 425,238" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-inventory-candidate" data-source="inventory" data-target="candidate" data-label="extract"><polyline points="725,238 805,238" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-candidate-review" data-source="candidate" data-target="review" data-label="submit draft"><polyline points="1105,238 1185,238" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-review-approved" data-source="review" data-target="approved" data-label="approved change"><polyline points="1485,238 1565,238" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-approved-release" data-source="approved" data-target="release" data-label="release"><polyline points="1710,295 1710,390" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-mission-roots" data-source="mission" data-target="roots" data-label="select"><polyline points="345,755 425,755" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-roots-l6" data-source="roots" data-target="l6" data-label="resolve"><polyline points="725,755 805,755" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-l6-result" data-source="l6" data-target="result" data-label="produce"><polyline points="1105,755 1185,755" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-result-l1" data-source="result" data-target="l1" data-label="consume"><polyline points="1485,755 1565,755" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-release-l6" data-source="release" data-target="l6" data-label="released revision"><polyline points="1565,448 955,448 955,680" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
