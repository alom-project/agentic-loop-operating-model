<text x="385" y="320" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">register</text>
<text x="765" y="320" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">extract</text>
<text x="1145" y="320" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">submit draft</text>
<text x="1525" y="320" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">approved change</text>
<text x="1755" y="349" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">release</text>
<text x="385" y="850" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">select</text>
<text x="765" y="850" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">resolve</text>
<text x="1145" y="850" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">produce</text>
<text x="1525" y="850" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">consume</text>
<text x="1260" y="430" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#354458">released revision</text>
<text x="950" y="42" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="bold" fill="#26384f">Rulebook onboarding: authority and consumption</text>
<text x="950" y="956" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#596878">AI extraction, Inventory registration, and L6 retrieval do not create Authority.</text>
<text x="950" y="989" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="normal" fill="#596878">Live operational state follows a separate path; it is not fully copied into the Rulebook.</text>
<text x="950" y="1020" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#596878">Based on ALOM-RULEBOOK-STD-001 §§4, 8, 13–15.</text>
<text x="470" y="535" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#6c5360">Failed review or unresolved required conditions block progression.</text>
</svg>
