<text x="955.0" y="749.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Authority / revision</text>
<text x="955.0" y="772.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">applicability / precedence</text>
<text x="955.0" y="795.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">citation</text>
