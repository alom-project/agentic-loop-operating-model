<text x="1710.0" y="453.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">tag / SHA / digest</text>
<text x="1710.0" y="476.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">release manifest</text>
