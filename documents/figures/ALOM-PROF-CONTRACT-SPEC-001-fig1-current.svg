<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1390" viewBox="0 0 2600 1390" role="img" aria-label="Profile Contract generation and runtime handoff">
<rect width="2600" height="1390" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker><marker id="arrow-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b34a4a"/></marker></defs>
<text x="55" y="65" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="bold" fill="#263751">Figure 1  ·  Profile Contract generation and runtime handoff</text>
<text x="55" y="108" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#516078">Successful path overview; decision branches are detailed in Compiler / Validator Figure 2</text>
<rect id="node-mission" x="50" y="350" width="430" height="180" rx="14" fill="#edf3fc" stroke="#415aa6" stroke-width="2.5"/>
<text x="72" y="398" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#243957">Mission / Analysis</text>
<text x="72" y="440" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">MissionSpec + Business Analysis</text>
<text x="72" y="472" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">Analysis: [PROPOSAL], non-authority</text>
<rect id="node-generator" x="580" y="350" width="400" height="180" rx="14" fill="#edf3fc" stroke="#415aa6" stroke-width="2.5"/>
<text x="602" y="398" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#243957">Profile Generator</text>
<text x="602" y="440" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">Typed Profile drafts</text>
<text x="602" y="472" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">No approval authority</text>
<rect id="node-compiler" x="1080" y="350" width="400" height="180" rx="14" fill="#edf3fc" stroke="#415aa6" stroke-width="2.5"/>
<text x="1102" y="398" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#243957">Deterministic Compiler</text>
<text x="1102" y="440" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">DraftProfileBundle</text>
<text x="1102" y="472" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">Pinned inputs / policy</text>
<rect id="node-validator" x="1580" y="350" width="400" height="180" rx="14" fill="#edf3fc" stroke="#415aa6" stroke-width="2.5"/>
<text x="1602" y="398" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#243957">Independent Validator</text>
<text x="1602" y="440" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">ValidationReport</text>
<text x="1602" y="472" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">ConflictRecord</text>
<rect id="node-review" x="2080" y="350" width="460" height="180" rx="14" fill="#edf3fc" stroke="#415aa6" stroke-width="2.5"/>
<text x="2102" y="398" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#243957">Human Review</text>
<text x="2102" y="440" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">Required Human decisions</text>
<text x="2102" y="472" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">ApprovalRecord when valid</text>
<rect id="node-rules" x="1080" y="150" width="400" height="125" rx="14" fill="#edf3fc" stroke="#415aa6" stroke-width="2.5"/>
<text x="1102" y="198" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#243957">ResolvedRuleSet</text>
<text x="1102" y="240" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">L6 resolution; L7 canonical source</text>
<rect id="node-admission" x="2080" y="760" width="460" height="180" rx="14" fill="#edf3fc" stroke="#415aa6" stroke-width="2.5"/>
<text x="2102" y="808" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#243957">Release / Registry</text>
<text x="2102" y="850" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">Release Authority authorizes</text>
<text x="2102" y="882" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">Registry admission commits</text>
<rect id="node-effective" x="1580" y="760" width="400" height="180" rx="14" fill="#edf3fc" stroke="#415aa6" stroke-width="2.5"/>
<text x="1602" y="808" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#243957">Effective Release</text>
<text x="1602" y="850" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">Immutable release</text>
<text x="1602" y="882" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">Profile digest</text>
<rect id="node-resolver" x="1080" y="760" width="400" height="180" rx="14" fill="#edf3fc" stroke="#415aa6" stroke-width="2.5"/>
<text x="1102" y="808" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#243957">Runtime Resolver</text>
<text x="1102" y="850" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">Scope / digest / capability</text>
<text x="1102" y="882" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">Revocation / HOLD / freshness</text>
<rect id="node-binding" x="580" y="760" width="400" height="180" rx="14" fill="#edf3fc" stroke="#415aa6" stroke-width="2.5"/>
<text x="602" y="808" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#243957">Mode-specific binding</text>
<text x="602" y="850" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">ALLOW + pinned refs</text>
<text x="602" y="882" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#40516b">Layers as required by mode</text>
<rect id="node-deny" x="1080" y="1050" width="400" height="150" rx="14" fill="#fff2f2" stroke="#b34a4a" stroke-width="2.5"/>
<text x="1102" y="1098" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#873535">DENY new use</text>
<text x="1102" y="1140" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#873535">REVOKED / active HOLD</text>
<text x="1102" y="1172" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#873535">unknown / stale / unavailable</text>
<g id="edge-mission-generator" data-source="mission" data-target="generator" data-meaning="mission and analysis input"><polyline points="480,440 580,440" fill="none" stroke="#40516b" stroke-width="3" marker-end="url(#arrow)"/></g>
<text x="530.0" y="428" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#40516b">context</text>
<g id="edge-generator-compiler" data-source="generator" data-target="compiler" data-meaning="typed drafts"><polyline points="980,440 1080,440" fill="none" stroke="#40516b" stroke-width="3" marker-end="url(#arrow)"/></g>
<text x="1030.0" y="428" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#40516b">drafts</text>
<g id="edge-rules-compiler" data-source="rules" data-target="compiler" data-meaning="resolved rule set"><polyline points="1280,275 1280,350" fill="none" stroke="#40516b" stroke-width="3" marker-end="url(#arrow)"/></g>
<text x="1295" y="318.5" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#40516b">rules</text>
<g id="edge-rules-generator" data-source="rules" data-target="generator" data-meaning="resolved rules for profile generation"><polyline points="1080,212 780,212 780,350" fill="none" stroke="#40516b" stroke-width="3" marker-end="url(#arrow)"/></g>
<text x="930.0" y="200" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#40516b">rules</text>
<g id="edge-compiler-validator" data-source="compiler" data-target="validator" data-meaning="draft profile bundle"><polyline points="1480,440 1580,440" fill="none" stroke="#40516b" stroke-width="3" marker-end="url(#arrow)"/></g>
<text x="1530.0" y="428" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#40516b">bundle</text>
<g id="edge-validator-review" data-source="validator" data-target="review" data-meaning="validation and conflict records"><polyline points="1980,440 2080,440" fill="none" stroke="#40516b" stroke-width="3" marker-end="url(#arrow)"/></g>
<text x="2030.0" y="428" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#40516b">report</text>
<g id="edge-review-admission" data-source="review" data-target="admission" data-meaning="valid Human ApprovalRecord"><polyline points="2310,530 2310,760" fill="none" stroke="#40516b" stroke-width="3" marker-end="url(#arrow)"/></g>
<text x="2325" y="651.0" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#40516b">approval</text>
<g id="edge-admission-effective" data-source="admission" data-target="effective" data-meaning="Registry admission committed"><polyline points="2080,850 1980,850" fill="none" stroke="#40516b" stroke-width="3" marker-end="url(#arrow)"/></g>
<text x="2030.0" y="838" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#40516b">admitted</text>
<g id="edge-effective-resolver" data-source="effective" data-target="resolver" data-meaning="immutable release and digest"><polyline points="1580,850 1480,850" fill="none" stroke="#40516b" stroke-width="3" marker-end="url(#arrow)"/></g>
<text x="1530.0" y="838" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#40516b">release</text>
<g id="edge-resolver-binding" data-source="resolver" data-target="binding" data-meaning="ALLOW and pinned mode-specific binding refs"><polyline points="1080,850 980,850" fill="none" stroke="#40516b" stroke-width="3" marker-end="url(#arrow)"/></g>
<text x="1030.0" y="838" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#40516b">ALLOW</text>
<g id="edge-resolver-deny" data-source="resolver" data-target="deny" data-meaning="deny when current state fails or is unknown"><polyline points="1280,940 1280,1050" fill="none" stroke="#b34a4a" stroke-width="3" marker-end="url(#arrow-stop)"/></g>
<text x="1295" y="1001.0" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#b34a4a">DENY</text>
<text x="65" y="1260" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#40516b">Only an approved, admitted and currently eligible release may be resolved for new Runtime use.</text>
<text x="65" y="1295" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#40516b">Generator / Compiler / Validator do not hold authority to make a Profile Effective.</text>
<text x="65" y="1330" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#40516b">Runtime denial also covers digest, effective-window and capability mismatches.</text>
</svg>
