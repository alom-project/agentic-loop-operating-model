<text x="1050" y="185" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#5b6575">Join is conditional. COMPLETED requires Graph Verification: invariants, required paths, evidence, policy validity and partial-failure rules (§11).</text>
<text x="1050" y="991" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#5b6575">Repeated states separate exceptional transitions and prevent crossing or overlapping arrows.</text>
