<text x="922" y="340" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Read-only input</text>
<rect id="parser" x="1700" y="220" width="600" height="180" rx="13" fill="#edf7f1" stroke="#55a276" stroke-width="2.5"/>
<text x="1722" y="267" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">OKF parser</text>
<text x="1722" y="308" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Concept / metadata / relations</text>
<text x="1722" y="340" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">External identifiers</text>
