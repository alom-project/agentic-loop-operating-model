<text x="122" y="788" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Pinned Git revision</text>
<text x="122" y="820" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Types / predicates / constraints</text>
<rect id="builder" x="900" y="700" width="500" height="180" rx="13" fill="#edf7f1" stroke="#55a276" stroke-width="2.5"/>
<text x="922" y="747" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Relation / ontology builder</text>
<text x="922" y="788" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Resolve identifiers</text>
<text x="922" y="820" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Build nodes / edges / properties</text>
<rect id="validate" x="1700" y="700" width="600" height="180" rx="13" fill="#fff2f1" stroke="#bc5151" stroke-width="2.5"/>
<text x="1722" y="747" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Validate relations</text>
<text x="1722" y="788" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Schema / cardinality / provenance</text>
<text x="1722" y="820" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Reject invalid output</text>
<rect id="infer" x="900" y="1120" width="500" height="180" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="922" y="1167" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Inference / semantic join</text>
<text x="922" y="1208" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Derived relations and mappings</text>
<text x="922" y="1240" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Preserve rule and source provenance</text>
<rect id="api" x="100" y="1120" width="500" height="180" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="122" y="1167" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Ontology API / MCP</text>
<text x="122" y="1208" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Resolve / traverse / join / explain</text>
<text x="122" y="1240" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Authorized derived access</text>
<rect x="60" y="1350" width="2280" height="150" rx="12" fill="#f5f7fb" stroke="#c4d0e0" stroke-width="1.5"/>
<text x="83" y="1386" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• A Producer proposes Draft / Patch materialization; it does not automatically approve or overwrite L7 sources.</text>
<text x="83" y="1422" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Inference remains Derived; AI suggestions remain candidates with evidence and confidence, not canonical relations.</text>
<text x="83" y="1458" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Resolve scope and authorization before retrieval candidate generation. Do not disclose invalid or unauthorized results.</text>
</svg>
