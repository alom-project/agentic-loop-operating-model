<text x="122" y="247" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Agentic entry</text>
<text x="122" y="288" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">L4 ExecutionIntent / TaskRef</text>
<text x="122" y="320" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">L2–L4 retain ALE control</text>
<rect id="interactive" x="900" y="200" width="600" height="180" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="922" y="247" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Interactive entry</text>
<text x="922" y="288" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Human / client request</text>
<text x="922" y="320" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Human retains work control</text>
<rect id="system" x="1700" y="200" width="600" height="180" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="1722" y="247" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Optional system mediation</text>
<text x="1722" y="288" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Deterministic-system request</text>
<text x="1722" y="320" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">L5 mediation is optional</text>
<rect id="request" x="100" y="500" width="2200" height="180" rx="13" fill="#f4f6f9" stroke="#8794a8" stroke-width="2.5"/>
<text x="122" y="547" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Common Execution Request</text>
<text x="122" y="588" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Purpose / actor / scope_ref / domain_id / isolation_scope_ref / mode / budget</text>
<text x="122" y="620" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Project overlay is optional; propagate the approved bindings and policy context.</text>
<rect id="resolver" x="900" y="850" width="600" height="180" rx="13" fill="#f3effd" stroke="#8b70bd" stroke-width="2.5"/>
<text x="922" y="897" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Harness resolver</text>
<text x="922" y="938" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Spec / profile / policy</text>
<text x="922" y="970" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Effective Harness + compatibility</text>
<rect id="controls" x="100" y="1250" width="600" height="180" rx="13" fill="#fff7e9" stroke="#c08d33" stroke-width="2.5"/>
<text x="122" y="1297" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">External enforcement</text>
<text x="122" y="1338" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Policy / tool / credentials / egress</text>
<text x="122" y="1370" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Filesystem / budget / stop / output</text>
<rect id="runner" x="900" y="1250" width="600" height="180" rx="13" fill="#edf7f1" stroke="#55a276" stroke-width="2.5"/>
<text x="922" y="1297" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Runner adapter</text>
<text x="922" y="1338" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Start / resume / stop</text>
<text x="922" y="1370" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Normalize event / result</text>
<rect id="result" x="1700" y="1250" width="600" height="180" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="1722" y="1297" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Execution result</text>
<text x="1722" y="1338" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Result / artifact / evidence</text>
<text x="1722" y="1370" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Return to originating controller</text>
<rect id="worker" x="900" y="1650" width="600" height="180" rx="13" fill="#edf7f1" stroke="#55a276" stroke-width="2.5"/>
<text x="922" y="1697" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Execution worker / runner</text>
<text x="922" y="1738" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Workspace / session / sandbox</text>
<text x="922" y="1770" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Short-lived scoped credentials</text>
<rect id="target" x="1700" y="1650" width="600" height="180" rx="13" fill="#f4f6f9" stroke="#8794a8" stroke-width="2.5"/>
<text x="1722" y="1697" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">External tools / systems</text>
<text x="1722" y="1738" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Tool / API / MCP / network</text>
<text x="1722" y="1770" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Actions through enforcement boundary</text>
<rect x="60" y="1950" width="2280" height="150" rx="12" fill="#f5f7fb" stroke="#c4d0e0" stroke-width="1.5"/>
<text x="83" y="1986" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Policy and scope checks apply before Runner start, Tool use and Action; budget, stop and output guards remain active as applicable.</text>
<text x="83" y="2022" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Controls intercept applicable Tool, network, file and output paths; arrows show data flow, not a bypass. Unknown authority / isolation fails closed.</text>
<text x="83" y="2058" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• L5 owns safe execution, not L4 convergence or Human work decisions. Human-only and deterministic-system work do not inherently require L5.</text>
</svg>
