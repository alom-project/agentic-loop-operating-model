<text x="192" y="670" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Lease / dispatcher / recovery</text>
<rect id="l3" x="170" y="820" width="430" height="150" rx="13" fill="#f3effd" stroke="#8b70bd" stroke-width="2.5"/>
