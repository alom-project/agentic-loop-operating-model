<text x="55" y="65" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="bold" fill="#233654">Figure 5 · Phase 1 reference deployment</text>
<text x="55" y="108" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#4a5e7c">Illustrative placement; preserve logical responsibility and security boundaries when co-locating components</text>
<rect x="100" y="450" width="1150" height="600" rx="16" fill="#f6f8fb" stroke="#c2cde0" stroke-width="2"/>
<text x="125" y="489" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">ALE deployable — illustrative co-location</text>
<text x="125" y="522" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#425678">L3 / L4 may share deployment with L2 while retaining ownership.</text>
<rect x="1400" y="450" width="900" height="600" rx="16" fill="#f6f8fb" stroke="#c2cde0" stroke-width="2"/>
<text x="1425" y="489" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">External durable stores</text>
<text x="1425" y="522" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#425678">State, queue, artifact and trace services are separate from the core.</text>
<rect x="100" y="1200" width="1150" height="400" rx="16" fill="#f6f8fb" stroke="#c2cde0" stroke-width="2"/>
<text x="125" y="1239" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Execution and isolation zone</text>
<text x="125" y="1272" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#425678">Shared execution; L5 remains outside ALE.</text>
<rect x="1400" y="1200" width="900" height="400" rx="16" fill="#f6f8fb" stroke="#c2cde0" stroke-width="2"/>
<text x="1425" y="1239" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">Operational targets</text>
<text x="1425" y="1272" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#425678">External actions remain subject to authorization and policy.</text>
