<text x="1472" y="1408" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Tool / MCP / action gateway</text>
<text x="1472" y="1440" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">DB / SaaS / Git / observability</text>
<rect x="60" y="1680" width="2280" height="186" rx="12" fill="#f5f7fb" stroke="#c4d0e0" stroke-width="1.5"/>
<text x="83" y="1716" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• This is an example rather than a product prescription; physical scale, HA and isolation require adopter-specific design.</text>
<text x="83" y="1752" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• L3 / L4 co-location is optional. L5 is the shared execution boundary and does not become part of ALE.</text>
<text x="83" y="1788" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• L2 canonical control state is distinct from L7 domain and knowledge authority.</text>
<text x="83" y="1824" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Policy, Context / SSOT access, Human decisions and additional telemetry connections are not exhaustively depicted.</text>
