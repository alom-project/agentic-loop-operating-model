<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2000" viewBox="0 0 2400 2000" role="img" aria-labelledby="title desc">
<title id="title">Figure 2 · Drift to new release</title>
<desc id="desc">Recompile is a new candidate; approval, authorization and Registry admission remain distinct</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#435877"/></marker><marker id="deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b94848"/></marker></defs>
<rect width="2400" height="2000" fill="#fff"/>
<text x="55" y="65" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="bold" fill="#233654">Figure 2 · Drift to new release</text>
<text x="55" y="108" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#4a5e7c">Recompile is a new candidate; approval, authorization and Registry admission remain distinct</text>
<path id="edge-signal-classify" d="M720 330 L720 370" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="740" y="355" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">signals</text>
<path id="edge-classify-compile" d="M720 530 L720 570" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="740" y="555" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">recompile needed</text>
<path id="edge-compile-diff" d="M720 730 L720 770" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="740" y="755" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">candidate</text>
<path id="edge-diff-validate" d="M720 930 L720 970" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="740" y="955" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">diff</text>
<path id="edge-validate-human" d="M720 1130 L720 1170" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="740" y="1155" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">validation</text>
<path id="edge-human-authority" d="M720 1330 L720 1370" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="740" y="1355" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">approved</text>
<path id="edge-authority-admit" d="M720 1530 L720 1570" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="740" y="1555" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">authorized request</text>
<path id="edge-class-noimpact" d="M1360 430 L1650 430" fill="none" stroke="#435877" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1450" y="410" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435877">no impact</text>
<path id="edge-class-unsafe" d="M1360 500 L1500 500 L1500 650 L1650 650" fill="none" stroke="#b94848" stroke-width="3" marker-end="url(#deny)"/>
<text x="1515" y="555" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#b94848">unsafe</text>
<path id="edge-validate-block" d="M1360 1050 L1650 1050" fill="none" stroke="#b94848" stroke-width="3" marker-end="url(#deny)"/>
<text x="1450" y="1030" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#b94848">blocking</text>
<path id="edge-review-reject" d="M1360 1250 L1650 1250" fill="none" stroke="#b94848" stroke-width="3" marker-end="url(#deny)"/>
<text x="1450" y="1230" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#b94848">decision</text>
<path id="edge-authority-human-decision" d="M1360 1450 L1500 1450 L1500 1285 L1650 1285" fill="none" stroke="#b94848" stroke-width="3" marker-end="url(#deny)"/>
<text x="1515" y="1390" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#b94848">Human decision</text>
<rect id="signal" x="80" y="170" width="1280" height="160" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="102" y="217" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">1  Detect and correlate drift</text>
<text x="102" y="258" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Source / compatibility / outcome signals</text>
<text x="102" y="290" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Identify impacted scope, work and releases</text>
<rect id="classify" x="80" y="370" width="1280" height="160" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="102" y="417" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">2  Classify impact</text>
<text x="102" y="458" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Evaluate semantic, authority and runtime impact</text>
<text x="102" y="490" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Distinguish no impact, unsafe and recompile cases</text>
<rect id="compile" x="80" y="570" width="1280" height="160" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="102" y="617" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">3  Draft recompile</text>
<text x="102" y="658" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Pin current sources and compatible policies</text>
<text x="102" y="690" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Deterministic Compiler produces a new candidate</text>
<rect id="diff" x="80" y="770" width="1280" height="160" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="102" y="817" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">4  Semantic Diff</text>
<text x="102" y="858" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Compare fields, mode, provenance and bindings</text>
<text x="102" y="890" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Record impact and required approvals</text>
<rect id="validate" x="80" y="970" width="1280" height="160" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="102" y="1017" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">5  Independent validation</text>
<text x="102" y="1058" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Schema / conformance / regression checks</text>
<text x="102" y="1090" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Blocking conflict or ERROR means no release</text>
<rect id="human" x="80" y="1170" width="1280" height="160" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="102" y="1217" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">6  Human Review</text>
<text x="102" y="1258" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Review candidate, evidence and impact</text>
<text x="102" y="1290" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">APPROVE / REJECT / REVISE</text>
<rect id="authority" x="80" y="1370" width="1280" height="160" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="102" y="1417" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">7  Release Authority</text>
<text x="102" y="1458" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Authorize the candidate-bound release request</text>
<text x="102" y="1490" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Apply relevant policy and scope</text>
<rect id="admit" x="80" y="1570" width="1280" height="160" rx="13" fill="#edf3fc" stroke="#4e68aa" stroke-width="2.5"/>
<text x="102" y="1617" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">8  Registry admission</text>
<text x="102" y="1658" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Final gate / control snapshot / CAS commit</text>
<text x="102" y="1690" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">New release is admitted before pointer use</text>
<rect id="noimpact" x="1650" y="370" width="670" height="160" rx="13" fill="#edf7f1" stroke="#55a276" stroke-width="2.5"/>
<text x="1672" y="417" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">NO SEMANTIC IMPACT</text>
<text x="1672" y="458" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Record evidence and retain current state</text>
<text x="1672" y="490" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Current security / hold controls still apply</text>
<rect id="unsafe" x="1650" y="570" width="670" height="160" rx="13" fill="#fff2f1" stroke="#bc5151" stroke-width="2.5"/>
<text x="1672" y="617" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">INCOMPATIBLE / UNSAFE</text>
<text x="1672" y="658" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Fail closed; block affected new use</text>
<text x="1672" y="690" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Fix, migrate or escalate to a Human</text>
<rect id="blocking" x="1650" y="970" width="670" height="160" rx="13" fill="#fff2f1" stroke="#bc5151" stroke-width="2.5"/>
<text x="1672" y="1017" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">BLOCKING VALIDATION</text>
<text x="1672" y="1058" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">No release; resolve and revalidate</text>
<text x="1672" y="1090" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Retain failure evidence</text>
<rect id="reject" x="1650" y="1170" width="670" height="160" rx="13" fill="#fff2f1" stroke="#bc5151" stroke-width="2.5"/>
<text x="1672" y="1217" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#233654">REJECT / REVISE</text>
<text x="1672" y="1258" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Close case; resubmit as new candidate</text>
<text x="1672" y="1290" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">Existing pointer is not proof of permission</text>
<rect x="60" y="1760" width="2280" height="114" rx="12" fill="#f5f7fb" stroke="#c4d0e0" stroke-width="1.5"/>
<text x="83" y="1796" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• A valid Human REJECT / REVISE committed before admission closes the case, even after an earlier approval.</text>
<text x="83" y="1832" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Retaining an existing pointer does not bypass current applicable REVOKED / HOLD, freshness, scope or authority checks.</text>
</svg>
