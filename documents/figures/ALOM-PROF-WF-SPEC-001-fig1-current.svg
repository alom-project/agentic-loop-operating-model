<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img">
<title>Workflow Figure 1 — Profile Review, Approval and Release</title>
<rect width="1800" height="1320" fill="white"/>
<text x="900.0" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#172943">Workflow Figure 1 — Profile Review, Approval and Release</text>
<rect x="495" y="675" width="1205" height="300" rx="18" fill="#f5f8fc" stroke="#7992b4" stroke-width="2" stroke-dasharray="10 6"/>
<text x="517" y="707" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#334f78">Shared authoritative commit boundary</text>
<polyline points="230,275 230,370" fill="none" stroke="#3c5c87" stroke-width="3"><title>Human enters an authorized decision.</title></polyline>
<polygon points="230,370 223,356 237,356" fill="#3c5c87"/>
<polyline points="380,445 570,445" fill="none" stroke="#3c5c87" stroke-width="3"><title>Review request and collected human decision.</title></polyline>
<polygon points="570,445 556,452 556,438" fill="#3c5c87"/>
<polyline points="570,405 380,405" fill="none" stroke="#3c5c87" stroke-width="3"><title>Review packet and progress.</title></polyline>
<polygon points="380,405 394,398 394,412" fill="#3c5c87"/>
<polyline points="380,660 440,660 440,530 650,530 650,480" fill="none" stroke="#3c5c87" stroke-width="3"><title>Immutable candidate and validation evidence.</title></polyline>
<polygon points="650,480 657,494 643,494" fill="#3c5c87"/>
<polyline points="380,830 465,830 465,560 750,560 750,480" fill="none" stroke="#3c5c87" stroke-width="3"><title>Required approvers, separation of duties, and policy.</title></polyline>
<polygon points="750,480 757,494 743,494" fill="#3c5c87"/>
<polyline points="900,450 960,450 960,745" fill="none" stroke="#3c5c87" stroke-width="3"><title>Verified human decision and case evidence update the unified authority.</title></polyline>
<polygon points="960,745 953,731 967,731" fill="#3c5c87"/>
<polyline points="900,405 1270,405" fill="none" stroke="#3c5c87" stroke-width="3"><title>Workflow hands off the case for release orchestration.</title></polyline>
<polygon points="1270,405 1256,412 1256,398" fill="#3c5c87"/>
<polyline points="1465,275 1465,370" fill="none" stroke="#3c5c87" stroke-width="3"><title>Release Authority authorizes the signed request.</title></polyline>
<polygon points="1465,370 1458,356 1472,356" fill="#3c5c87"/>
<polyline points="1370,480 1370,745" fill="none" stroke="#3c5c87" stroke-width="3"><title>Signed ReleaseRequest is submitted to the registry.</title></polyline>
<polygon points="1370,745 1363,731 1377,731" fill="#3c5c87"/>
<polyline points="1560,745 1560,480" fill="none" stroke="#3c5c87" stroke-width="3"><title>The admission result is returned.</title></polyline>
<polygon points="1560,480 1567,494 1553,494" fill="#3c5c87"/>
<polyline points="1020,785 1180,785" fill="none" stroke="#3c5c87" stroke-width="3"><title>Registry uses authoritative current approval eligibility and case version.</title></polyline>
<polygon points="1180,785 1166,792 1166,778" fill="#3c5c87"/>
<polyline points="1180,835 1020,835" fill="none" stroke="#3c5c87" stroke-width="3"><title>The admitted marker and registry state are committed together.</title></polyline>
<polygon points="1020,835 1034,828 1034,842" fill="#3c5c87"/>
<polyline points="800,875 800,1040" fill="none" stroke="#3c5c87" stroke-width="3"><title>Decision and approval evidence is correlated.</title></polyline>
<polygon points="800,1040 793,1026 807,1026" fill="#3c5c87"/>
<polyline points="1400,875 1400,1000 1050,1000 1050,1040" fill="none" stroke="#3c5c87" stroke-width="3"><title>Admission or denial evidence is correlated.</title></polyline>
<polygon points="1050,1040 1043,1026 1057,1026" fill="#3c5c87"/>
<rect x="80" y="170" width="300" height="105" rx="12" fill="#fff7e9" stroke="#b08043" stroke-width="2"/>
<text x="230.0" y="209.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#182b45">Human Approver</text>
<text x="230.0" y="236.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Authorized decision</text>
<rect x="80" y="370" width="300" height="110" rx="12" fill="#f0f4fb" stroke="#6981a4" stroke-width="2"/>
<text x="230.0" y="412.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#182b45">Review UI / Dashboard</text>
<text x="230.0" y="439.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Packet, evidence, decision</text>
<rect x="80" y="610" width="300" height="100" rx="12" fill="#f0f4fb" stroke="#6981a4" stroke-width="2"/>
<text x="230.0" y="647.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#182b45">Candidate / Validation</text>
<text x="230.0" y="674.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Immutable inputs</text>
<rect x="80" y="780" width="300" height="100" rx="12" fill="#f0f4fb" stroke="#6981a4" stroke-width="2"/>
<text x="230.0" y="817.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#182b45">Authority / Policy</text>
<text x="230.0" y="844.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Approvers, SoD, scope</text>
<rect x="570" y="370" width="330" height="110" rx="12" fill="#f0f4fb" stroke="#6981a4" stroke-width="2"/>
<text x="735.0" y="399.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#182b45">Review Workflow</text>
<text x="735.0" y="426.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Progress and decisions</text>
<text x="735.0" y="453.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">No separate approval authority</text>
<rect x="1270" y="170" width="390" height="105" rx="12" fill="#fff7e9" stroke="#b08043" stroke-width="2"/>
<text x="1465.0" y="209.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#182b45">Release Authority</text>
<text x="1465.0" y="236.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Authorizes release request</text>
<rect x="1270" y="370" width="390" height="110" rx="12" fill="#f0f4fb" stroke="#6981a4" stroke-width="2"/>
<text x="1465.0" y="412.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#182b45">Release Service</text>
<text x="1465.0" y="439.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Signed request and submit</text>
<rect x="550" y="745" width="470" height="130" rx="12" fill="#eef6f1" stroke="#62937a" stroke-width="2"/>
<text x="785.0" y="784.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#182b45">L1 Unified Approval Management</text>
<text x="785.0" y="811.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Approval eligibility and case version</text>
<text x="785.0" y="838.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Immutable decision / evidence ledger</text>
<rect x="1180" y="745" width="470" height="130" rx="12" fill="#e9f4ed" stroke="#4c8b68" stroke-width="2"/>
<text x="1415.0" y="784.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#182b45">Registry Admission</text>
<text x="1415.0" y="811.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Admit / pointer / controls</text>
<text x="1415.0" y="838.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Uses L1 authoritative eligibility</text>
<rect x="600" y="1040" width="600" height="100" rx="12" fill="#f3f1fa" stroke="#887ca8" stroke-width="2"/>
<text x="900.0" y="1077.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#182b45">Trace / Evidence</text>
<text x="900.0" y="1104.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182b45">Decision and admission correlation</text>
<rect x="245.3" y="307" width="129.39999999999998" height="23" fill="white" opacity=".97"/>
<text x="310" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">Human decision</text>
<rect x="414.35" y="377" width="121.3" height="23" fill="white" opacity=".97"/>
<text x="475" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">Review packet</text>
<rect x="394.1" y="449" width="161.79999999999998" height="23" fill="white" opacity=".97"/>
<text x="475" y="467" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">Request / decision</text>
<rect x="436.9" y="502" width="194.2" height="23" fill="white" opacity=".97"/>
<text x="534" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">candidate + validation</text>
<rect x="523.4" y="570" width="113.19999999999999" height="23" fill="white" opacity=".97"/>
<text x="580" y="588" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">policy / SoD</text>
<rect x="1015.25" y="374" width="137.5" height="23" fill="white" opacity=".97"/>
<text x="1084" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">release handoff</text>
<rect x="1409.55" y="307" width="88.89999999999999" height="23" fill="white" opacity=".97"/>
<text x="1454" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">authorize</text>
<rect x="1013.05" y="745" width="169.9" height="23" fill="white" opacity=".97"/>
<text x="1098" y="763" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">current eligibility</text>
<rect x="1027.2" y="846" width="145.6" height="23" fill="white" opacity=".97"/>
<text x="1100" y="864" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">admission marker</text>
<rect x="1175.3" y="602" width="129.39999999999998" height="23" fill="white" opacity=".97"/>
<text x="1240" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">signed request</text>
<rect x="1577.7" y="602" width="64.6" height="23" fill="white" opacity=".97"/>
<text x="1610" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">result</text>
<rect x="963.05" y="570" width="169.9" height="23" fill="white" opacity=".97"/>
<text x="1048" y="588" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#304b70">decision / evidence</text>
<rect x="80" y="1175" width="1600" height="105" rx="12" fill="#fafbfd" stroke="#c2ccd9"/>
<text x="100" y="1205" font-family="Arial,sans-serif" font-size="17" fill="#263c59">REJECT / REVISE closure and new admission are ordered at the same authoritative boundary.</text>
<text x="100" y="1232" font-family="Arial,sans-serif" font-size="17" fill="#263c59">Valid REJECT / REVISE first blocks admission; admission first makes a later pre-admission decision too late.</text>
<text x="100" y="1259" font-family="Arial,sans-serif" font-size="17" fill="#263c59">Each case is bound to one candidate and target; at most one new admission may commit.</text>
</svg>
