<text x="1722" y="1216" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">L6 Context / Knowledge</text>
<text x="1722" y="1248" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#354b69">L7 SSOT / Authority</text>
<rect x="60" y="1560" width="2280" height="150" rx="12" fill="#f5f7fb" stroke="#c4d0e0" stroke-width="1.5"/>
<text x="83" y="1596" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• ALE is the logical grouping of L2–L4; L5, L6 and L7 are separate boundaries outside ALE.</text>
<text x="83" y="1632" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Co-location is optional. IdP, policy engine, protected artifacts and stores can remain external Authorities / services.</text>
<text x="83" y="1668" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Ports carry versioned contracts and their own response paths; arrows shown identify the illustrative initiating data direction.</text>
