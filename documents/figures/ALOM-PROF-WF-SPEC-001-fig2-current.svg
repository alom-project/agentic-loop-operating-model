<title id="figure-title">Illustrative Profile review screen with pending approval</title>
<desc id="figure-desc">A project-optional Finance work case shows pinned scope, ReviewPacket and release intent, critical diff, validation, approver decisions and pending release readiness. Human Decision evidence and current admission eligibility are separate.</desc>
