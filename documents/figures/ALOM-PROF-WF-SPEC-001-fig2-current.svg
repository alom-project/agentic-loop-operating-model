<text id="footer-binding" x="70" y="1655" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#243956">Bind Decision to case, candidate, validation, policy, and the displayed ReviewPacket / Release Intent.</text>
<text id="footer-refs" x="70" y="1692" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#243956">Retain immutable refs / digests, actor and authority; verify Human authentication, delegation and SoD.</text>
<text id="footer-signatures" x="70" y="1729" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#243956">Verify an authoritative Decision signature / attestation and policy-required signatures.</text>
<text id="footer-check" x="70" y="1766" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#243956">Check current authoritative eligibility / control state; unknown or stale blocks new admission.</text>
<text id="footer-separation" x="70" y="1803" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#243956">A recorded Decision is not a release. Release Authority and Registry admission remain separate.</text>
