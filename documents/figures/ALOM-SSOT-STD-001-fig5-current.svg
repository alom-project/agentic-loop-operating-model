<text x="375" y="147" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#354458">Context</text>
<text x="760" y="147" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#354458">Provide</text>
<text x="1135" y="147" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#354458">Intent</text>
<text x="1520" y="251" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">ActionIntent</text>
<text x="1717" y="251" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">authorized update</text>
