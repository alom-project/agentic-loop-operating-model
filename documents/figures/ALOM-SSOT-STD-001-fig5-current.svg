<text x="380" y="259" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#354458">approved merge</text>
<text x="1050" y="30" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#26384f">End-to-end provenance connecting business facts and Knowledge SSOT</text>
<text x="1050" y="54" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#596878">Correlation across the seven-layer view, ALE Subsystem, L5 Shared Execution, L7 Verification, and Trace / Evidence.</text>
<text x="1070" y="581" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="bold" fill="#a25454">Trace correlation of applicable records</text>
<text x="1070" y="608" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#a25454">Dashed association: no action or authority transfer</text>
<text x="1050" y="688" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#3d4a5a">Correlates across Layer / Subsystem boundaries by trace_id; has no Authority to update Knowledge / Operational SSOT.</text>
<text x="1050" y="725" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#3d4a5a">Correlation keys: trace_id / purpose_id / scope_ref / domain_id / isolation_scope_ref</text>
<text x="1050" y="755" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#3d4a5a">task_id (agentic) / project_id (optional) | concept_id / commit_sha | authority_id / source_revision | action_id / transaction_ref | verification_id / evidence_ref</text>
<text x="1050" y="956" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#3d4a5a">Note: L7 returns the same Authority / Revision / Transaction / Verification contracts across execution routes.</text>
</svg>
