<text x="530.0" y="830.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">Agentic Work: ALE manages Graph / Loop state and convergence</text>
</g>
<g id="node-interactive"><rect x="1085" y="795" width="970" height="58" rx="10" fill="#fff5e8" stroke="#c88a35" stroke-width="2.2"/>
<text x="1570.0" y="830.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#172538">Interactive Agent Work: Human manages the interaction loop and uses L5 directly</text>
</g>
<g id="node-gateway"><rect x="1540" y="114" width="155" height="116" rx="10" fill="#ebf6ef" stroke="#238a72" stroke-width="2.2"/>
<text x="1617.5" y="135.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="bold" fill="#172538">L7 Action Gateway</text>
<text x="1617.5" y="152.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#172538">Authority / Policy</text>
<text x="1617.5" y="169.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#172538">AuthZ</text>
<text x="1617.5" y="186.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#172538">Human Control</text>
<text x="1617.5" y="203.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#172538">Idempotency</text>
