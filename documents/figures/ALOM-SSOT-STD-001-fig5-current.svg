<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1000" viewBox="0 0 2240 1000" role="img" aria-labelledby="title desc">
<title id="title">End-to-end provenance connecting business facts and Knowledge SSOT</title><desc id="desc">Structured review diagram with aligned panels and orthogonal connections.</desc>
