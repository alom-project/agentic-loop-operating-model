<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1030" viewBox="0 0 1800 1030" role="img" aria-label="Seven ALOM layers grouped into a logical stack, with ALE containing L2, L3 and L4, and notes that the stack does not imply a required execution sequence">
<rect width="1800" height="1030" fill="#ffffff"/>
<text x="45" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="bold" fill="#172438">ALOM 7-Layer Integrated Reference Architecture</text>
<text x="45" y="82" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#5b6778">Responsibility boundaries and the ALE logical subsystem</text>
<rect x="40" y="110" width="940" height="865" rx="18" fill="#ffffff" stroke="#c4ceda" stroke-width="2"/>
<text x="65" y="145" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" fill="#172438">ALOM  |  Seven-layer view</text>
<rect x="64" y="265" width="892" height="293" rx="16" fill="#ffffff" stroke="#415ec4" stroke-width="2.4"/>
<text x="86" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" fill="#415ec4">ALE - Agent Loop Engine  |  logical subsystem</text>
<rect x="64" y="170" width="892" height="68" rx="13" fill="#f0edff" stroke="#6953d2" stroke-width="2"/>
<text x="84" y="198" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#172438">L1  Operating Model &amp; Governance</text>
<text x="84" y="222" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#172438">Purpose / Role / Authority / Policy / Human Control / Outcome / SLO / Learning</text>
<rect x="85" y="308" width="850" height="68" rx="13" fill="#edf1ff" stroke="#4354c6" stroke-width="2"/>
<text x="105" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#172438">L2  Control Plane</text>
<text x="105" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#172438">Task / Durable State / Manifest / Scheduler / Queue / Lease / Recovery</text>
<rect x="85" y="389" width="850" height="68" rx="13" fill="#eaf8f0" stroke="#29966a" stroke-width="2"/>
<text x="105" y="417" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#172438">L3  Graph Engineering</text>
<text x="105" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#172438">Topology / Routing / Join / Shared State / Dynamic Rewrite</text>
<rect x="85" y="470" width="850" height="68" rx="13" fill="#f4edff" stroke="#8650c9" stroke-width="2"/>
<text x="105" y="498" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#172438">L4  Agentic Loop</text>
<text x="105" y="522" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#172438">Plan / Act / Evaluate / Verify / Repair / Termination</text>
<rect x="64" y="585" width="892" height="68" rx="13" fill="#fff5e9" stroke="#c77b20" stroke-width="2"/>
<text x="84" y="613" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#172438">L5  ALOM Shared Execution Plane</text>
<text x="84" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#172438">Harness / Runner / Worker / Sandbox / Tool / Credential / Enforcement</text>
<rect x="64" y="680" width="892" height="68" rx="13" fill="#eaf8f0" stroke="#29966a" stroke-width="2"/>
<text x="84" y="708" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#172438">L6  Context &amp; Knowledge</text>
<text x="84" y="732" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#172438">Context / Retrieval / Ontology / Knowledge API / Citation</text>
<rect x="64" y="775" width="892" height="68" rx="13" fill="#fff0f0" stroke="#be5a5a" stroke-width="2"/>
<text x="84" y="803" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#172438">L7  SSOT</text>
<text x="84" y="827" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#172438">Knowledge SSOT / Operational SSOT / Authority / Canonical Record</text>
<text x="66" y="896" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#596575">A layer identifies semantic ownership and responsibility.</text>
<text x="66" y="922" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#596575">Physical placement may vary while contracts are preserved.</text>
<rect x="1008" y="110" width="752" height="865" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1038" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#172438">How to read this view</text>
<rect x="1038" y="180" width="692" height="105" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>
<text x="1058" y="209" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" fill="#29436b">Layer view</text>
<text x="1058" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">Vertical position does not prescribe a required</text>
<text x="1058" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">execution sequence.</text>
<rect x="1038" y="299" width="692" height="105" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>
<text x="1058" y="328" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" fill="#29436b">ALE boundary</text>
<text x="1058" y="354" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">L2, L3 and L4 form one logical subsystem.</text>
<text x="1058" y="378" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">ALE is not an additional layer.</text>
<rect x="1038" y="418" width="692" height="105" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>
<text x="1058" y="447" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" fill="#29436b">Shared execution</text>
<text x="1058" y="473" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">Interactive Agent Work can use L5 directly</text>
<text x="1058" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">without going through ALE.</text>
<rect x="1038" y="537" width="692" height="105" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>
<text x="1058" y="566" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" fill="#29436b">Execution modes</text>
<text x="1058" y="592" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">Human-only and deterministic-system do not</text>
<text x="1058" y="616" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">require ALE; L5 is not universally required.</text>
<rect x="1038" y="656" width="692" height="105" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>
<text x="1058" y="685" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" fill="#29436b">Management boundary</text>
<text x="1058" y="711" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">L1 registers and governs ALOM Managed Work</text>
<text x="1058" y="735" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">across execution modes.</text>
<text x="1038" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" fill="#29436b">Across managed work</text>
<text x="1038" y="844" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">Control:  Purpose / Policy / Authority / Human Gate</text>
<text x="1038" y="873" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172438">Evidence:  Trace / Eval / Outcome / Learning</text>
<text x="1038" y="928" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#596575">This view does not depict individual runtime paths.</text>
</svg>
