<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380" role="img" aria-labelledby="title desc">
<title id="title">Knowledge SSOT normal update and release flow</title><desc id="desc">Structured review diagram with aligned panels and orthogonal connections.</desc>
<rect width="1800" height="1380" fill="#ffffff"/>
<defs>
<marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7558c5"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398e66"/></marker>
</defs>
<g id="edge-e1" data-source="proposal" data-target="request" data-label="submit"><polyline points="900,200 900,265" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-e2" data-source="request" data-target="ci" data-label="run checks"><polyline points="760,365 760,405 475,405 475,450" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-e3" data-source="request" data-target="review" data-label="request review"><polyline points="1040,365 1040,405 1325,405 1325,450" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-e4" data-source="ci" data-target="gate" data-label="check status"><polyline points="475,580 475,630 760,630 760,685" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-e5" data-source="review" data-target="gate" data-label="approval status"><polyline points="1325,580 1325,630 1040,630 1040,685" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-e6" data-source="gate" data-target="blocked" data-label="not satisfied"><polyline points="1180,740 1370,740" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-e7" data-source="gate" data-target="merge" data-label="satisfied"><polyline points="900,795 900,860" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-e8" data-source="merge" data-target="release" data-label="when releasing"><polyline points="900,965 900,1035" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="node-proposal"><rect x="620" y="100" width="560" height="100" rx="10" fill="#f2efff" stroke="#7953c8" stroke-width="2.2"/>
<text x="900.0" y="133.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">1  Change proposal</text>
<text x="900.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Human / Agent / materialization Producer</text>
<text x="900.0" y="179.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Draft or patch proposal</text>
</g>
<g id="node-request"><rect x="620" y="265" width="560" height="100" rx="10" fill="#eeefff" stroke="#5362c6" stroke-width="2.2"/>
<text x="900.0" y="298.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">2  Change request</text>
<text x="900.0" y="321.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Issue / Branch</text>
<text x="900.0" y="344.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Pull Request or Merge Request</text>
</g>
<g id="node-ci"><rect x="130" y="450" width="690" height="130" rx="10" fill="#eaf8f1" stroke="#318d62" stroke-width="2.2"/>
<text x="475.0" y="498.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">3a  CI validation</text>
<text x="475.0" y="521.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Lint / links / schema / trust</text>
<text x="475.0" y="544.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Evaluation / secrets / relation consistency</text>
</g>
<g id="node-review"><rect x="980" y="450" width="690" height="130" rx="10" fill="#f2efff" stroke="#7953c8" stroke-width="2.2"/>
<text x="1325.0" y="498.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">3b  Required review</text>
<text x="1325.0" y="521.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">CODEOWNERS AND Human Approval</text>
<text x="1325.0" y="544.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Apply the relevant approval authority</text>
</g>
<g id="node-gate"><rect x="620" y="685" width="560" height="110" rx="10" fill="#fff5e8" stroke="#c57a1c" stroke-width="2.2"/>
<text x="900.0" y="711.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">4  Merge eligibility</text>
<text x="900.0" y="734.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Required CI checks pass AND</text>
<text x="900.0" y="757.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">required approvals are granted AND</text>
<text x="900.0" y="780.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">other applicable controls are satisfied</text>
</g>
<g id="node-blocked"><rect x="1370" y="685" width="300" height="110" rx="10" fill="#fff1f1" stroke="#c65f65" stroke-width="2.2"/>
<text x="1520.0" y="734.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">No merge</text>
<text x="1520.0" y="757.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Requirements not satisfied</text>
</g>
<g id="node-merge"><rect x="620" y="860" width="560" height="105" rx="10" fill="#eaf8f1" stroke="#318d62" stroke-width="2.2"/>
<text x="900.0" y="895.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">5  Protected default branch</text>
<text x="900.0" y="918.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Approved merge</text>
<text x="900.0" y="941.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Post-merge commit SHA = version boundary</text>
</g>
<g id="node-release"><rect x="620" y="1035" width="560" height="125" rx="10" fill="#eeefff" stroke="#5362c6" stroke-width="2.2"/>
<text x="900.0" y="1080.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">6  Knowledge release</text>
<text x="900.0" y="1103.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Release tag → commit SHA → snapshot</text>
<text x="900.0" y="1126.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">SHA-256 digest / KnowledgeReleaseManifest</text>
</g>
<rect x="916.52" y="224" width="66.97" height="19" fill="#ffffff"/>
<text x="950" y="238" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#354458">submit</text>
<rect x="570.43" y="385" width="99.14" height="19" fill="#ffffff"/>
<text x="620" y="399" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#354458">run checks</text>
<rect x="1124.56" y="385" width="130.88" height="19" fill="#ffffff"/>
<text x="1190" y="399" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#354458">request review</text>
<rect x="563.43" y="610" width="113.14" height="19" fill="#ffffff"/>
<text x="620" y="624" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#354458">check status</text>
<rect x="1111.91" y="610" width="136.19" height="19" fill="#ffffff"/>
<text x="1180" y="624" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#354458">approval status</text>
<rect x="1219.69" y="716" width="110.62" height="19" fill="#ffffff"/>
<text x="1275" y="730" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#354458">not satisfied</text>
<rect x="920.34" y="819" width="79.31" height="19" fill="#ffffff"/>
<text x="960" y="833" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#354458">satisfied</text>
<rect x="908.20" y="990" width="133.59" height="19" fill="#ffffff"/>
<text x="975" y="1004" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#354458">when releasing</text>
<text x="60" y="40" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" fill="#172538">Knowledge SSOT standard update flow</text>
<text x="130" y="1220" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#47566b">Normal path shown. Authorized break-glass is governed separately by Section 7.4.</text>
<text x="130" y="1252" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#47566b">Agents and Producers do not directly update the protected branch; Producers cannot automatically approve a draft.</text>
<text x="130" y="1284" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#47566b">Ontology Runtime may derive relations but cannot update canonical relations without review.</text>
<text x="130" y="1316" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#47566b">RAG / Indexer build derived indexes; they do not update the Knowledge source.</text>
</svg>
