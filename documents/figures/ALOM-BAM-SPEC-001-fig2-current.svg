<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
<title id="title">Business Analysis Model: logical entity relationships</title><desc id="desc">Structured review diagram with aligned panels and orthogonal connections.</desc>
<rect width="1700" height="900" fill="#ffffff"/>
<defs>
<marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7558c5"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398e66"/></marker>
</defs>
<g id="panel-bam"><rect x="50" y="105" width="1600" height="485" rx="12" fill="#fbfcff" stroke="#4962a5" stroke-width="2"/>
<text x="63" y="127" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#4962a5">BusinessAnalysisModel workspace  |  analysis is non-Authority</text>
</g>
<g id="edge-source-evidence" data-source="source" data-target="evidence" data-label="referenced by"><polyline points="340,225 465,225" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-evidence-claim" data-source="evidence" data-target="claim" data-label="supports / refutes / context"><polyline points="750,225 880,225" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-claim-entity" data-source="claim" data-target="entity" data-label="describes"><polyline points="1165,225 1300,225" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-evidence-assumption" data-source="evidence" data-target="assumption" data-label="may provide basis"><polyline points="607,270 607,405" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-claim-unresolved" data-source="claim" data-target="unresolved" data-label="may identify gaps"><polyline points="1022,270 1022,405" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-assumption-unresolved" data-source="assumption" data-target="unresolved" data-label="may require resolution"><polyline points="750,450 970,450" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-workspace-snapshot" data-source="workspace" data-target="snapshot" data-label="freeze if policy permits"><polyline points="210,495 210,685" fill="none" stroke="#398e66" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/></g>
<g id="node-source"><rect x="80" y="180" width="260" height="90" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="210.0" y="219.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">AnalysisSource</text>
<text x="210.0" y="242.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">revision and locator</text>
</g>
<g id="node-evidence"><rect x="465" y="180" width="285" height="90" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="607.5" y="219.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">EvidenceItem</text>
<text x="607.5" y="242.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#172538">direction and source reference</text>
</g>
<g id="node-claim"><rect x="880" y="180" width="285" height="90" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="1022.5" y="219.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">AnalysisClaim</text>
<text x="1022.5" y="242.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">confidence and evidence refs</text>
</g>
<g id="node-entity"><rect x="1300" y="180" width="300" height="90" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="1450.0" y="219.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#172538">Business entity / process</text>
<text x="1450.0" y="242.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">role, work, control, etc.</text>
</g>
<g id="node-workspace"><rect x="80" y="405" width="260" height="90" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="210.0" y="444.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">BAM workspace</text>
<text x="210.0" y="467.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">editable analysis state</text>
</g>
<g id="node-assumption"><rect x="465" y="405" width="285" height="90" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="607.5" y="444.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">Assumption</text>
<text x="607.5" y="467.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">basis and affected items</text>
</g>
<g id="node-unresolved"><rect x="970" y="405" width="310" height="90" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="1125.0" y="444.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">UnresolvedItem</text>
<text x="1125.0" y="467.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">severity and blocking stage</text>
</g>
<g id="node-snapshot"><rect x="80" y="685" width="260" height="90" rx="10" fill="#f2fbf5" stroke="#398e66" stroke-width="2.2"/>
<text x="210.0" y="724.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">AnalysisSnapshot</text>
<text x="210.0" y="747.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">immutable, digest pinned</text>
</g>
<text x="402" y="212" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">referenced by</text>
<text x="815" y="165" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">supports / refutes / context</text>
<text x="1232" y="212" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">describes</text>
<text x="620" y="343" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">may provide basis</text>
<text x="1037" y="343" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">may identify gaps</text>
<text x="860" y="435" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">may require resolution</text>
<text x="225" y="646" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">freeze if policy permits</text>
<text x="410" y="698" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#354458">The snapshot records the eligible workspace state, source revisions and digest.</text>
<text x="410" y="735" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#354458">Confidence does not grant Authority. AS_IS and TO_BE_PROPOSAL remain distinct.</text>
<text x="410" y="772" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#354458">Open items are retained according to their severity and blocking stage.</text>
</svg>
