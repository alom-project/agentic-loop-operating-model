<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180" role="img" aria-labelledby="title desc">
<title id="title">Operational SSOT action and verification</title><desc id="desc">Structured review diagram with aligned panels and orthogonal connections.</desc>
<rect width="1900" height="1180" fill="#ffffff"/>
<defs>
<marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7558c5"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398e66"/></marker>
</defs>
<g id="panel-main"><rect x="20" y="90" width="1860" height="470" rx="12" fill="#ffffff" stroke="#7e8da4" stroke-width="2"/>
<text x="33" y="112" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#7e8da4">Authorized action and verification</text>
</g>
<g id="panel-cases"><rect x="20" y="590" width="1860" height="460" rx="12" fill="#fcfbfd" stroke="#9b8fa8" stroke-width="2"/>
<text x="33" y="612" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#9b8fa8">Handle these conditions according to the applicable control</text>
</g>
<g id="edge-exec-gateway" data-source="execution" data-target="gateway" data-label="ActionIntent"><polyline points="405,260 515,260" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-gateway-ssot" data-source="gateway" data-target="ssot" data-label="authorized update"><polyline points="935,260 1045,260" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-ssot-verify" data-source="ssot" data-target="verify" data-label="result / canonical read"><polyline points="1405,260 1515,260" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-verify-controller" data-source="verify" data-target="controller" data-label="VerificationResult"><polyline points="1685,330 1685,435 1305,435" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="node-execution"><rect x="45" y="200" width="360" height="120" rx="10" fill="#fff5e8" stroke="#c88a35" stroke-width="2.2"/>
<text x="225.0" y="243.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">Execution origin / L5</text>
<text x="225.0" y="266.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Agentic or Interactive work</text>
<text x="225.0" y="289.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Enforce execution constraints</text>
</g>
<g id="node-gateway"><rect x="515" y="180" width="420" height="160" rx="10" fill="#ebf6ef" stroke="#238a72" stroke-width="2.2"/>
<text x="725.0" y="231.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">L7 Action Gateway</text>
<text x="725.0" y="254.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Authority / Policy / AuthZ</text>
<text x="725.0" y="277.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Human Control / Idempotency</text>
<text x="725.0" y="300.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Preconditions</text>
</g>
<g id="node-ssot"><rect x="1045" y="200" width="360" height="120" rx="10" fill="#f4f4f5" stroke="#7d838a" stroke-width="2.2"/>
<text x="1225.0" y="243.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172538">Operational SSOT</text>
<text x="1225.0" y="266.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Authorized transaction</text>
<text x="1225.0" y="289.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Canonical state</text>
</g>
<g id="node-verify"><rect x="1515" y="190" width="340" height="140" rx="10" fill="#ebf6ef" stroke="#53a77c" stroke-width="2.2"/>
<text x="1685.0" y="231.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">L7 Verification</text>
<text x="1685.0" y="254.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Compare expected and</text>
<text x="1685.0" y="277.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">observed canonical state</text>
<text x="1685.0" y="300.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Record verification evidence</text>
</g>
<g id="node-repeat"><rect x="55" y="675" width="545" height="235" rx="10" fill="#f3efff" stroke="#8769cc" stroke-width="2.2"/>
<text x="327.5" y="764.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#172538">Same Intent received again</text>
<text x="327.5" y="787.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Return existing Action / Transaction</text>
<text x="327.5" y="810.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">or verify canonical state</text>
<text x="327.5" y="833.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Do not duplicate the side effect</text>
</g>
<g id="node-unknown"><rect x="678" y="675" width="545" height="235" rx="10" fill="#fff7e9" stroke="#c88a35" stroke-width="2.2"/>
<text x="950.5" y="764.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#172538">Timeout: result unknown</text>
<text x="950.5" y="787.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Check idempotency key, transaction</text>
<text x="950.5" y="810.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">lookup or read-after-write first</text>
<text x="950.5" y="833.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Do not blindly retry</text>
</g>
<g id="node-mismatch"><rect x="1300" y="675" width="545" height="235" rx="10" fill="#fdf0ef" stroke="#c65a55" stroke-width="2.2"/>
<text x="1572.5" y="764.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#172538">Expected ≠ observed</text>
<text x="1572.5" y="787.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Retry read / reconcile / compensation</text>
<text x="1572.5" y="810.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">rollback / human escalation</text>
<text x="1572.5" y="833.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Choose a suitable response</text>
</g>
<g id="node-controller"><rect x="515" y="395" width="790" height="80" rx="10" fill="#f0efff" stroke="#706bd2" stroke-width="2.2"/>
<text x="910.0" y="419.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">Return to the initiating controller</text>
<text x="910.0" y="441.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Agentic: ALE / L4  |  Interactive: Human / Client</text>
<text x="910.0" y="463.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Controller decides the next action or completion</text>
</g>
<text x="460" y="357" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">ActionIntent</text>
<text x="990" y="357" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">authorized update</text>
<text x="1460" y="357" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">result / canonical read</text>
<text x="1495" y="416" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#354458">VerificationResult</text>
<text x="950" y="42" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="bold" fill="#26384f">Operational SSOT: controlled action and verification</text>
<text x="950" y="532" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="normal" fill="#3d4a5a">Failed gateway checks stop, deny, require human review, or report conflict as applicable.</text>
<text x="950" y="955" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#596878">Case panels describe conditions; they are not a mandatory sequence.</text>
<text x="950" y="1100" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#596878">Based on L7 §§10.1, 10.3 and 11.2–11.5. Ambiguous-failure handling details include proposals.</text>
</svg>
