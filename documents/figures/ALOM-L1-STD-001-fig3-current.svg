<text x="83" y="1166" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• These are main paths, not an exhaustive transition policy; stops and remediation follow the applicable controls.</text>
<text x="83" y="1202" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• A gate failure or missing approval does not automatically promote work; retirement includes evidence and credential revocation.</text>
<text x="83" y="1238" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#354b69">• Lifecycle learning proposes changes to Purpose, Work, Policy, Eval and Human Control; protected sources are not automatically rewritten.</text>
