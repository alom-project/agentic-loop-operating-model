<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
<title id="title">ALOM seven-layer model and L3 Graph Engineering</title><desc id="desc">Structured review diagram with aligned panels and orthogonal connections.</desc>
<rect width="1280" height="980" fill="#ffffff"/>
<defs>
<marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7558c5"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398e66"/></marker>
</defs>
<g id="panel-ale"><rect x="60" y="184" width="1160" height="348" rx="12" fill="#ffffff" stroke="#5362c6" stroke-width="2"/>
<text x="73" y="206" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#5362c6">ALE  |  Logical execution subsystem  |  L2–L4</text>
</g>
<g id="node-l1"><rect x="90" y="80" width="1100" height="80" rx="10" fill="#f2efff" stroke="#7953c8" stroke-width="2.2"/>
<text x="640.0" y="114.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#172538">L1  Operating Model &amp; Governance</text>
<text x="640.0" y="137.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Purpose / Managed Work / Authority / Policy / Outcome / Human Control</text>
</g>
<g id="node-l2"><rect x="90" y="225" width="1100" height="80" rx="10" fill="#eaf8f1" stroke="#318d62" stroke-width="2.2"/>
<text x="640.0" y="259.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#172538">L2  Control Plane</text>
<text x="640.0" y="282.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Task / Durable State / Scheduler / Queue / Lease / Recovery</text>
</g>
<g id="node-l3"><rect x="90" y="320" width="1100" height="80" rx="10" fill="#eeefff" stroke="#4b46c7" stroke-width="2.2"/>
<text x="640.0" y="354.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#172538">L3  Graph Engineering</text>
<text x="640.0" y="377.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Topology / Routing / Join / Shared State / Verification / Dynamic Rewrite</text>
</g>
<g id="node-l4"><rect x="90" y="415" width="1100" height="80" rx="10" fill="#f3efff" stroke="#7953c8" stroke-width="2.2"/>
<text x="640.0" y="449.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#172538">L4  Agentic Loop</text>
<text x="640.0" y="472.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Plan / Execute / Evaluate / Verify / Repair / Termination</text>
</g>
<g id="node-l5"><rect x="90" y="550" width="1100" height="80" rx="10" fill="#fff5e8" stroke="#c57a1c" stroke-width="2.2"/>
<text x="640.0" y="584.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#172538">L5  ALOM Shared Execution Plane</text>
<text x="640.0" y="607.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Harness / Runner / Worker / Sandbox / Tool / Credential / Telemetry</text>
</g>
<g id="node-l6"><rect x="90" y="645" width="1100" height="80" rx="10" fill="#eaf8f1" stroke="#318d62" stroke-width="2.2"/>
<text x="640.0" y="679.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#172538">L6  Context &amp; Knowledge</text>
<text x="640.0" y="702.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Meaning / Retrieval / Ontology / Context Pack / Knowledge API</text>
</g>
<g id="node-l7"><rect x="90" y="740" width="1100" height="80" rx="10" fill="#f2efff" stroke="#7953c8" stroke-width="2.2"/>
<text x="640.0" y="774.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#172538">L7  SSOT</text>
<text x="640.0" y="797.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">Knowledge SSOT / Operational SSOT / Authority / Record</text>
</g>
<text x="60" y="40" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" fill="#172538">L3 Graph Engineering in the seven-layer model</text>
<text x="90" y="862" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#47566b">L5 is a shared execution boundary outside ALE; Interactive Agents may also use it.</text>
<text x="90" y="893" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#47566b">L3 owns ALE's organization responsibility. It connects L2 durable control</text>
<text x="90" y="916" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#47566b">with L4 convergence control; agent execution is delegated to L5.</text>
</svg>
