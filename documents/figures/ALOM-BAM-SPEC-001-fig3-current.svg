<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1140" viewBox="0 0 1700 1140" role="img" aria-labelledby="title desc">
<title id="title">Business analysis refinement and handoff lifecycle</title><desc id="desc">Structured review diagram with aligned panels and orthogonal connections.</desc>
<rect width="1700" height="1140" fill="#ffffff"/>
<defs>
<marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7558c5"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398e66"/></marker>
</defs>
<g id="panel-analysis"><rect x="45" y="100" width="1610" height="225" rx="12" fill="#fbfcff" stroke="#4962a5" stroke-width="2"/>
<text x="58" y="122" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#4962a5">1  Intake and analysis</text>
</g>
<g id="panel-mission"><rect x="45" y="470" width="1610" height="210" rx="12" fill="#fbfcff" stroke="#4962a5" stroke-width="2"/>
<text x="58" y="492" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#4962a5">2  Mission confirmation</text>
</g>
<g id="panel-snapshot"><rect x="45" y="740" width="1610" height="210" rx="12" fill="#f7fcf8" stroke="#398e66" stroke-width="2"/>
<text x="58" y="762" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#398e66">3  Analysis snapshot</text>
</g>
<g id="edge-intake-sources" data-source="intake" data-target="sources" data-label="register"><polyline points="350,212 465,212" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-sources-structure" data-source="sources" data-target="structure" data-label="structure"><polyline points="740,212 855,212" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-structure-assess" data-source="structure" data-target="assess" data-label="evaluate"><polyline points="1130,212 1245,212" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-assess-candidate" data-source="assess" data-target="candidate" data-label="develop a candidate"><polyline points="1410,255 1410,425 320,425 320,540" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-assess-workspace" data-source="assess" data-target="workspace" data-label="retain assessed model"><polyline points="1370,255 1370,365 25,365 25,852 75,852" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-candidate-human" data-source="candidate" data-target="human" data-label="submit"><polyline points="350,582 465,582" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-human-mission" data-source="human" data-target="mission-spec" data-label="confirm"><polyline points="740,582 855,582" fill="none" stroke="#398e66" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/></g>
<g id="edge-mission-generator" data-source="mission-spec" data-target="generator" data-label="confirmed"><polyline points="1130,582 1250,582" fill="none" stroke="#398e66" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/></g>
<g id="edge-workspace-policy" data-source="workspace" data-target="policy" data-label="evaluate"><polyline points="350,852 465,852" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-human-policy" data-source="human" data-target="policy" data-label="required confirmation"><polyline points="602,625 602,810" fill="none" stroke="#40516b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/></g>
<g id="edge-policy-frozen" data-source="policy" data-target="frozen" data-label="if permitted"><polyline points="740,852 855,852" fill="none" stroke="#398e66" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/></g>
<g id="edge-frozen-generator" data-source="frozen" data-target="generator" data-label="provide snapshot"><polyline points="1130,852 1412,852 1412,625" fill="none" stroke="#398e66" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/></g>
<g id="node-intake"><rect x="75" y="170" width="275" height="85" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="212.5" y="207.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">MissionInput</text>
<text x="212.5" y="230.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">request and scope hint</text>
</g>
<g id="node-sources"><rect x="465" y="170" width="275" height="85" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="602.5" y="207.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">Capture sources</text>
<text x="602.5" y="230.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">evidence and provenance</text>
</g>
<g id="node-structure"><rect x="855" y="170" width="275" height="85" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="992.5" y="207.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">Structure model</text>
<text x="992.5" y="230.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">claims, entities and process</text>
</g>
<g id="node-assess"><rect x="1245" y="170" width="330" height="85" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="1410.0" y="207.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">Assess analysis</text>
<text x="1410.0" y="230.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">confidence and unresolved</text>
</g>
<g id="node-candidate"><rect x="75" y="540" width="275" height="85" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="212.5" y="577.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">MissionCandidate</text>
<text x="212.5" y="600.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">objective, scope, outcomes</text>
</g>
<g id="node-human"><rect x="465" y="540" width="275" height="85" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="602.5" y="577.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">Business Owner</text>
<text x="602.5" y="600.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">reviews and confirms</text>
</g>
<g id="node-mission-spec"><rect x="855" y="540" width="275" height="85" rx="10" fill="#f2fbf5" stroke="#398e66" stroke-width="2.2"/>
<text x="992.5" y="577.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">MissionSpec</text>
<text x="992.5" y="600.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">confirmed mission</text>
</g>
<g id="node-generator"><rect x="1250" y="540" width="325" height="85" rx="10" fill="#f2fbf5" stroke="#398e66" stroke-width="2.2"/>
<text x="1412.5" y="577.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">Profile Generator</text>
<text x="1412.5" y="600.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">uses both inputs</text>
</g>
<g id="node-workspace"><rect x="75" y="810" width="275" height="85" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="212.5" y="847.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">Assessed BAM</text>
<text x="212.5" y="870.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">editable workspace</text>
</g>
<g id="node-policy"><rect x="465" y="810" width="275" height="85" rx="10" fill="#f5f8fc" stroke="#4962a5" stroke-width="2.2"/>
<text x="602.5" y="847.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">Blocking policy</text>
<text x="602.5" y="870.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">check applicable stage</text>
</g>
<g id="node-frozen"><rect x="855" y="810" width="275" height="85" rx="10" fill="#f2fbf5" stroke="#398e66" stroke-width="2.2"/>
<text x="992.5" y="847.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#172538">AnalysisSnapshot</text>
<text x="992.5" y="870.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#172538">immutable, digest pinned</text>
</g>
<text x="407" y="199" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">register</text>
<text x="797" y="199" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">structure</text>
<text x="1187" y="199" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">evaluate</text>
<text x="810" y="412" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">develop a candidate</text>
<text x="665" y="352" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">retain assessed model</text>
<text x="407" y="569" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">submit</text>
<text x="797" y="569" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">confirm</text>
<text x="1190" y="569" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">confirmed</text>
<text x="407" y="839" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">evaluate</text>
<text x="615" y="720" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">required confirmation</text>
<text x="797" y="839" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">if permitted</text>
<text x="1265" y="838" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#354458">provide snapshot</text>
<text x="65" y="1010" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="normal" fill="#354458">Blocking items are handled at their specified stage; nonblocking open items may remain.</text>
<text x="65" y="1043" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="normal" fill="#354458">Unresolved required controls prevent the affected transition. No missing values are silently inferred.</text>
<text x="65" y="1076" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="normal" fill="#354458">Mission confirmation and snapshot freezing are distinct operations; neither grants Rulebook Authority.</text>
</svg>
